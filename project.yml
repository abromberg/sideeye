name: SideEye
options:
  bundleIdPrefix: energy.experimental
  # Keep the app's package pins in the tracked Package.resolved. Without this, Xcode writes them into
  # FocusCore/Package.resolved, and `swift test` takes them out again.
  postGenCommand: >-
    mkdir -p SideEye.xcodeproj/project.xcworkspace/xcshareddata/swiftpm &&
    ln -sf ../../../../Package.resolved SideEye.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
  deploymentTarget:
    macOS: "26.0"
packages:
  FocusCore:
    path: FocusCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
targets:
  SideEye:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: FocusCore
      - package: Sparkle
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Side Eye
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: © 2026 Experimental LLC
        # Updates: scripts/release.sh writes the appcast and derives download links from this URL.
        SUFeedURL: https://github.com/abromberg/sideeye/releases/latest/download/appcast.xml
        SUPublicEDKey: PhK6BdeMKNp1F4FHzZqUN9gxVtmYBImjWKXQvDo7Wb4=
        SUEnableAutomaticChecks: true
    entitlements:
      path: App/SideEye.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_NAME: Side Eye
        PRODUCT_BUNDLE_IDENTIFIER: energy.experimental.sideeye
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
