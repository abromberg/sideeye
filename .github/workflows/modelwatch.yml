name: modelwatch
on:
  schedule:
    - cron: "0 15 * * 1" # Mondays
  workflow_dispatch:
    inputs:
      agent-model:
        description: OpenRouter model for the agent this run (blank = registry or default)
      dry-run:
        description: Run the agent and show the PR in the run summary, without opening it
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  modelwatch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false } # keeps the token out of the agent's reach
      - uses: abromberg/modelwatch@main
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          agent-model: ${{ inputs.agent-model }}
          dry-run: ${{ inputs.dry-run }}
