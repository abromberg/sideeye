<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="Side Eye installer background: an arrow from the app to Applications">
  <!-- Finder places the app icon centered at (170, 190) and Applications at (470, 190); see scripts/make-dmg.sh. -->
  <rect width="640" height="400" fill="#f5f1e9"/>
  <!-- The eye glances toward Applications. -->
  <g transform="translate(298.4 104) scale(2.4)" fill="#252820">
    <defs>
      <path id="eye" d="M3.1 8.4 14.9 7.2C14.9 11.4 12.6 13.1 9 13.1C5.9 13.1 3.7 11.6 3.1 8.4Z"/>
      <mask id="cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18">
        <rect width="18" height="18" fill="white"/>
        <use href="#eye" fill="black"/>
      </mask>
      <clipPath id="eye-clip"><use href="#eye"/></clipPath>
    </defs>
    <g transform="translate(1.6875 3.1875) scale(.8125)">
      <path d="M9 1C15.8 1 17 2.2 17 9S15.8 17 9 17 1 15.8 1 9 2.2 1 9 1Z" mask="url(#cutout)"/>
      <ellipse cx="12.35" cy="9.2" rx="1.6" ry="2.3" clip-path="url(#eye-clip)"/>
    </g>
    <path d="M8.3 4.5C8.1 2.8 8.7 1.3 10 .7C10.7 .4 11.1 1.2 10.5 1.7C9.6 2.5 9.5 3.4 9.6 4.5C11 2.8 12.8 2.5 14 2.5C13.5 4 12.2 5.1 10.1 5.5L9 6.4 7.9 5.5C5.8 5.1 4.5 4 4 2.5C5.5 2.5 7 3.1 8.3 4.5Z"/>
  </g>
  <!-- A gentle arc between the icons, and a head that follows the curve's final direction. -->
  <g fill="none" stroke="#64685e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M266 196C298 178 336 178 368 192"/>
    <path d="M362.4 178.9 370 193 354.5 197"/>
  </g>
  <text x="320" y="342" text-anchor="middle" font-family="SF Pro Text, Helvetica Neue, sans-serif" font-size="15" fill="#64685e">Drag Side Eye into Applications to install it.</text>
</svg>
